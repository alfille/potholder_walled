ldap_host = "127.0.0.1"
ldap_port = 3890

http_host = "127.0.0.1"
http_port = 17170

## The public URL of the server, for password reset links.
http_url = "${FQDN}"

## Base DN for LDAP.
ldap_base_dn = "${DC}"

## Admin username.
ldap_user_dn = "admin"

## Admin email.
## Email for the admin account. It is only used when initially creating
## the admin user, and can safely be omitted.
ldap_user_email = "paul.alfille@gmail.com"
