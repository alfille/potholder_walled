# yamllint disable rule:comments-indentation
---
###############################################################################
##                           Authelia Configuration                          ##
###############################################################################

## The theme to display: light, dark, grey, auto.
theme:  'auto'

server:
  address: 'tcp://127.0.0.1:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

##
## Identity Validation Configuration
##
## This configuration tunes the identity validation flows.
identity_validation:

  ## Reset Password flow. Adjusts how the reset password flow operates.
  reset_password:

##
## Authentication Backend Provider Configuration
authentication_backend:
  ldap:
    address: 'ldap://127.0.0.1:3890'
    implementation: 'lldap'
    base_dn: '${DC}'
    ## The username and password of the admin user.
    user: 'uid=admin,ou=people,${DC}'

## Note: the order of the rules is important. The first policy matching (domain, resource, subject) applies.
access_control:
  default_policy: 'deny'

  rules:

    # auth is post-check
    - domain: 'auth.${FQDN}'
      policy: 'bypass'

    # lldap webb admin console
    - domain: 'lldap.${FQDN}'
      policy: 'bypass'

    # couchdb Fauxton admin console
    - domain: 'couchdb.${FQDN}'
      subject: 'group:couchdb_admin'
      policy: 'one_factor'

    # replication
    - domain: 'couchdb-replication.${FQDN}'
      policy: 'bypass'

    # database
    - domain: 'potholder.${FQDN}'
      subject: 'group:potholder'
      policy: 'one_factor'

    # everyone
    - domain: '*.${FQDN}'
      subject: 'group:couch_admin'
      policy: 'one_factor'
      

##
## Session Provider Configuration
session:
#  secret: '' #env
  expiration: '24h'
  inactivity: '12h'
  remember_me: '1M'
  cookies:
    - domain: 'int.alfille.org'
      authelia_url: 'https://auth.int.alfille.org'
##
## Storage Provider Configuration
storage:
  local:
    ## Path to the SQLite3 Database.
    path: '/var/lib/authelia/db.sqlite3'


##
## Notification Provider
notifier:
  filesystem:
    filename: '/var/lib/authelia/notification.txt'

log:
  level: debug
  format: text

...
